<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página HTML</title>
    <link rel="stylesheet" href="./style/exemplos.css">
</head>
<body>
    <!-- A tag header serve para estruturar o cabeçalho da página -->
    <header>
    <!--h1 serve para um título.-->
        <h1>Minha Página HTML Básica</h1>
        <nav>
            <a href="./10_filmes.html">Outra página</a>


        </nav>
    </header>

    <!--Tag de estruturação-->
    <section>
        <div>
            <h3>Lista não ordenada</h3>

                <li>Tomate</li>

        <div>

           <ol>
                <li>Rio do Sul</li>
                <li>Lontras</li>

           </ol> 
        </div>

</html>
